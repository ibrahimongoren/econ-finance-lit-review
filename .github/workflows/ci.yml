name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pandoc (report tests; LibreOffice-based PDF tests are skipped in CI)
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy matplotlib openpyxl python-docx pyyaml pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Build the uploadable skill archive
        if: matrix.python-version == '3.13'
        run: python tools/build_skill_zip.py
      - name: Upload the archive
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: econ-finance-lit-review-skill
          path: dist/econ-finance-lit-review.zip
